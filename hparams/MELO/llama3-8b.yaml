model:
  name: /home/hmpiao/hmpiao/chkt/Meta-Llama-3-8B
  class_name: AutoModel
  tokenizer_class: AutoTokenizer
  tokenizer_name: null
  fan_in_fan_out: True
  target_modules:
    #- model.layers.31.mlp.up_proj   #用于T-patcher
    #- model.layers.31.mlp.down_proj   #用于T-patcher
    #- model.layers.31.mlp.up_proj   #用于melo
    - model.layers.27.mlp.down_proj  #用于melo_origin, grace
  pt: /data/hmpiao/FME/checkpoint # set this to 'hallucination' inside your checkpoint directory
  grace_layer: model.layers.14.mlp.down_proj
lora:
  cls_name:  /data2/hmpiao/FME/cached_model/distilbert-base-cased
